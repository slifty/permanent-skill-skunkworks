name: ci
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check the committed server bundle is up to date
        run: npm run check:bundle
      - name: Validate the marketplace and plugin
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate . --strict
          npx --yes @anthropic-ai/claude-code plugin validate ./plugins/permanent --strict
